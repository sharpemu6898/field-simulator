<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="description"
      content="Simulador interactivo de campos eléctricos"
    />
    <meta name="robots" content="index,follow" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Simulador de campo eléctrico</title>

    <link rel="stylesheet" href="estilos.css" />
  </head>

  <body>
    <main>
      <section id="portada" class="hero">
        <h1 id="titulo">Field Simulator</h1>

        <h2 id="sub">
          Haz visible lo invisible: explora el campo eléctrico
        </h2>

        <button id="boton-comienzo" type="button">
          Comenzar simulación
        </button>
      </section>

      <section
        id="simulador"
        class="simulador"
        aria-labelledby="titulo-simulador"
        hidden
      >
        <header class="encabezado-simulador">
          <div class="linea-electrica" aria-hidden="true"></div>

          <h2 id="titulo-simulador">
            Laboratorio de partículas eléctricas
          </h2>

          <div class="linea-electrica" aria-hidden="true"></div>
        </header>

        <div class="contenido-simulador">
          <aside id="menus" class="menus">
            <section class="menu">
              <h3 class="titulo-menu">Tipo de carga</h3>

              <div class="opciones-carga">
                <button
                  class="boton-tipo-carga positiva seleccionada"
                  type="button"
                  data-valor-carga="1"
                  aria-pressed="true"
                >
                  <span class="simbolo-carga">+</span>
                  Positiva
                </button>

                <button
                  class="boton-tipo-carga negativa"
                  type="button"
                  data-valor-carga="-1"
                  aria-pressed="false"
                >
                  <span class="simbolo-carga">−</span>
                  Negativa
                </button>
              </div>
            </section>
          </aside>

          <div id="area-simulacion" class="area-simulacion">
            <canvas id="lienzo"></canvas>

            <div
              id="lecturas-cursor"
              class="lecturas-cursor"
            ></div>
          </div>
        </div>

        <div class="linea-electrica inferior" aria-hidden="true"></div>
      </section>
    </main>

    <script src="render.js"></script>
    <script src="ui.js"></script>
  </body>
</html>
